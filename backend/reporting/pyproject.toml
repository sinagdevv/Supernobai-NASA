[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terrawindow-report"
version = "0.1.0"
description = "TERRAWINDOW Layer 6: research-run storage, integrity checks, and dossier generation"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "fpdf2>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
terrawindow-report = "terrawindow_report.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: needs TERRAWINDOW_DATABASE_URL pointing at the PostGIS database"]
