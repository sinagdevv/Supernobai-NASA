[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terrawindow-geo"
version = "0.1.0"
description = "TERRAWINDOW Layer 3: geospatial terrain processing engine"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "rasterio>=1.4",
    "pyproj>=3.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
terrawindow-geo = "terrawindow_geo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs internet access to public COG buckets (deselected by default)"]
addopts = "-m 'not network'"
